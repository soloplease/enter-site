<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
background:#f8f8f4;
overflow:hidden;
font-family:Arial,sans-serif;
text-transform:uppercase;
cursor:default;
color:#111;
}

/* NAME */
.name{
position:fixed;
top:16px;
left:24px;
font-size:18px;
font-weight:bold;
z-index:40;
}

/* LINKS */
.links{
position:fixed;
top:24px;
right:24px;
display:flex;
gap:22px;
z-index:200; /* ABOVE NAV AREAS */
pointer-events:auto;
}

.links a{
text-decoration:none;
color:#111;
font-size:11px;
transition:.2s ease;
cursor:pointer;
}

.links a:hover{
font-weight:bold;
font-size:12px;
}

.links a.active{
font-style:italic;
}

/* VIEWER */
.viewer{
position:relative;
width:100vw;
height:100vh;
display:flex;
align-items:center;
overflow:hidden;
}

/* TRACK */
.track{
display:flex;
gap:30px;
will-change:transform;
transition:transform .4s cubic-bezier(.22,.61,.36,1);
}

/* SLIDE */
.slide{
flex:none;
display:flex;
flex-direction:column;
}

/* IMAGE */
.imageWrap{
height:70vh;
display:flex;
align-items:center;
justify-content:center;
}

.imageWrap img{
max-height:70vh;
max-width:80vw;
object-fit:contain;
display:block;
user-select:none;
-webkit-user-drag:none;
cursor:zoom-in;
filter:grayscale(100%);
transition:filter .3s ease;
}

.slide.active img{
filter:grayscale(0%);
}

/* NAV (FIXED — NO UI BLOCKING) */
.nav{
position:fixed;
top:0;
width:120px;          /* small safe zone ONLY */
height:100vh;

display:flex;
align-items:center;
justify-content:center;

z-index:50;

pointer-events:none;  /* IMPORTANT: prevents blocking links */
}

.nav.left{left:0;}
.nav.right{right:0;}

.arrow{
font-size:34px;
color:#b8b8b2;
opacity:.25;
transition:.2s ease;
pointer-events:auto; /* only arrow is active */
user-select:none;
}

/* hover highlight */
.nav:hover .arrow{
color:#ffffff;
opacity:1;
transform:scale(1.15);
}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
}

.overlay.active{
display:flex;
}

.overlayNav{
position:fixed;
top:0;
width:120px;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
z-index:1010;
cursor:pointer;
}

.overlayNav.left{left:0;}
.overlayNav.right{right:0;}

.overlayArrow{
font-size:40px;
color:#fff;
opacity:.3;
transition:.2s ease;
}

.overlayNav:hover .overlayArrow{
opacity:1;
transform:scale(1.15);
}

/* CLOSE */
.close{
position:absolute;
top:20px;
right:28px;
font-size:32px;
color:#fff;
z-index:1020;
cursor:pointer;
}

/* CAPTION */
.overlayCaption{
margin-top:14px;
color:#fff;
font-size:11px;
text-align:center;
}

</style>
</head>

<body>

<div class="name">SOLOMON ROUSSEAU</div>

<div class="links">
<a href="selected-works.html" class="active">SELECTED WORKS</a>
<a href="exhibitions.html">SELECTED EXHIBITIONS + RESIDENCIES</a>
<a href="acquisitions.html">ACQUISITIONS</a>
<a href="artist.html">ARTIST</a>
</div>

<div class="viewer">
<div class="nav left" onclick="prev()"><div class="arrow">◀</div></div>
<div class="nav right" onclick="next()"><div class="arrow">▶</div></div>
<div class="track" id="track"></div>
</div>

<div class="overlay" id="overlay">
<div class="overlayNav left" onclick="prevDetail(event)"><div class="overlayArrow">◀</div></div>
<div class="overlayNav right" onclick="nextDetail(event)"><div class="overlayArrow">▶</div></div>
<div class="close" onclick="closeOverlay()">×</div>
<img id="overlayImg">
<div class="overlayCaption" id="caption"></div>
</div>

<script>

/* WORKS */
const works = [
{
title:"ROWS",
images:["SR-rows.JPG","SR-rows-D1.JPG","SR-rows-D2.JPG","SR-rows-D3.JPG"]
},
{
title:"COIL I",
images:["SR-coil(I).webp"]
},
{
title:"COIL IX",
images:["SR-coil(IX).JPG","SR-coil(IX)-D1.JPG","SR-coil(IX)-D2.JPG"]
},
{
title:"SCATTER",
images:["SR-scatter.JPG","SR-scatter-D1.JPG"]
},
{
title:"TUBES",
images:["SR-tubes.JPG","SR-tubes-D1.JPG"]
}
];

/* TRUE INFINITE LOOP (NO SNAP BACK) */
const track = document.getElementById("track");
const loop = [...works, ...works, ...works];

loop.forEach((w,i)=>{
const slide = document.createElement("div");
slide.className = "slide";

slide.innerHTML = `
<div class="imageWrap">
<img src="${w.images[0]}">
</div>
`;

slide.querySelector("img").onclick = () => open(i % works.length);

track.appendChild(slide);
});

const slides = document.querySelectorAll(".slide");

/* START POSITION (COIL IX CENTERED) */
let current = works.length + 2;

/* RENDER */
function render(){

let offset = 0;

for(let i=0;i<current;i++){
offset += slides[i].offsetWidth + 30;
}

const center = (window.innerWidth/2) - (slides[current].offsetWidth/2);

track.style.transform = `translateX(${center - offset}px)`;

slides.forEach(s=>s.classList.remove("active"));
slides[current].classList.add("active");
}

/* INFINITE (NO VISUAL RESET) */
function next(){
current++;
render();
if(current >= works.length * 2) current -= works.length;
}

function prev(){
current--;
render();
if(current < works.length) current += works.length;
}

/* OVERLAY */
let active = null;
let dIndex = 0;

function open(i){
active = works[i];
dIndex = 0;
show();
document.getElementById("overlay").classList.add("active");
}

function show(){
document.getElementById("overlayImg").src = active.images[dIndex];
document.getElementById("caption").innerText = active.title;
}

function nextDetail(e){
e.stopPropagation();
dIndex = (dIndex + 1) % active.images.length;
show();
}

function prevDetail(e){
e.stopPropagation();
dIndex = (dIndex - 1 + active.images.length) % active.images.length;
show();
}

function closeOverlay(){
document.getElementById("overlay").classList.remove("active");
}

/* INIT */
window.addEventListener("load", render);
window.addEventListener("resize", render);

</script>

</body>
</html>
