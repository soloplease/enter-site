<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
overflow:hidden;
background:#f2f2ee;
font-family:Arial,sans-serif;
color:#111;
cursor:default;
}

/* TITLE */

.title{
position:fixed;
top:14px;
left:50%;
transform:translateX(-50%);
font-size:16px;
font-weight:bold;
letter-spacing:.3px;
z-index:50;
}

/* TOP LINKS */

.sidebar{
position:fixed;
top:16px;
left:22px;

display:flex;
flex-direction:row;
gap:18px;

z-index:50;
}

.sidebar a{
text-decoration:none;
color:#111;
font-size:13px;
font-style:italic;
}

/* VIEWPORT */

.viewport{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

display:flex;
align-items:flex-start;
justify-content:center;

padding-top:64px;
box-sizing:border-box;
}

/* TRACK */

.track{
display:flex;
align-items:flex-start;
gap:6px;

will-change:transform;

transition:transform .45s cubic-bezier(.22,.61,.36,1);
}

/* SLIDES */

.slide{
flex:none;

display:flex;
flex-direction:column;
align-items:flex-start;
}

/* IMAGE */

.imageWrap{
height:84vh;

display:flex;
align-items:flex-start;
justify-content:center;
}

.imageWrap img{
height:84vh;
width:auto;

display:block;
object-fit:contain;

cursor:zoom-in;

user-select:none;
-webkit-user-drag:none;
}

/* CAPTION */

.caption{
margin-top:8px;
padding-left:2px;

font-size:11px;
line-height:1.35;
}

/* NAV ZONES */

#leftZone,
#rightZone{
position:fixed;
top:0;
width:16vw;
height:100vh;
z-index:60;
}

#leftZone{
left:0;
}

#rightZone{
right:0;
}

/* ARROWS */

.arrow{
position:fixed;
top:50%;
transform:translateY(-50%);

font-size:18px;

opacity:0;
transition:opacity .2s ease;

pointer-events:none;

z-index:80;
}

.arrow.left{
left:18px;
}

.arrow.right{
right:18px;
}

#leftZone:hover ~ .arrow.left{
opacity:.45;
}

#rightZone:hover ~ .arrow.right{
opacity:.45;
}

/* OVERLAY */

#overlay{
position:fixed;
inset:0;

background:rgba(0,0,0,.94);

display:none;
align-items:center;
justify-content:center;

z-index:200;
}

#overlayInner{
display:flex;
flex-direction:column;
align-items:flex-start;
}

#overlayImg{
max-width:96vw;
max-height:88vh;
object-fit:contain;
}

#overlayCaption{
margin-top:12px;

font-size:12px;
line-height:1.45;

color:#f2f2ee;
}

</style>
</head>

<body>

<div class="title">
SELECTED WORKS
</div>

<div class="sidebar">
<a href="artist.html">Artist</a>
<a href="#">Selected Exhibitions + Residencies</a>
</div>

<div class="viewport">

<div class="track" id="track"></div>

</div>

<div id="leftZone"></div>
<div id="rightZone"></div>

<div class="arrow left">◀</div>
<div class="arrow right">▶</div>

<div id="overlay">

<div id="overlayInner">

<img id="overlayImg">

<div id="overlayCaption"></div>

</div>

</div>

<script>

const works = [

{
img:"SR-rows.JPG",
title:"Untitled (scatter)",
material:"Steel",
size:"375 sq. ft",
year:"2026"
},

{
img:"SR-rows-D1.JPG",
title:"Untitled (coil I)",
material:"Steel",
size:"12 in. D x 3.5 in. W",
year:"2024"
},

{
img:"SR-rows-D2.JPG",
title:"Untitled (coil IX)",
material:"Steel",
size:"23ft D x 1.6ft W",
year:"2026"
},

{
img:"SR-rows-D3.JPG",
title:"Detail — Untitled (coil IX)",
material:"Steel",
size:"23ft D x 1.6ft W",
year:"2026"
}

];

const track = document.getElementById("track");

const extended = [
works[works.length-1],
...works,
works[0]
];

extended.forEach(work=>{

const slide = document.createElement("div");

slide.className = "slide";

slide.innerHTML = `

<div class="imageWrap">
<img src="${work.img}">
</div>

<div class="caption">
<div><i>${work.title}</i></div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
</div>

`;

slide.querySelector("img").onclick = ()=>{

document.getElementById("overlay").style.display = "flex";

document.getElementById("overlayImg").src = work.img;

document.getElementById("overlayCaption").innerHTML = `
<div><i>${work.title}</i></div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
`;

};

track.appendChild(slide);

});

let current = 1;

function update(animate=true){

const slides = document.querySelectorAll(".slide");

let offset = 0;

for(let i=0;i<current;i++){

offset += slides[i].offsetWidth + 6;

}

const active = slides[current];

const center =
(window.innerWidth / 2) -
(active.offsetWidth / 2);

track.style.transition =
animate
? "transform .45s cubic-bezier(.22,.61,.36,1)"
: "none";

track.style.transform =
`translateX(${center - offset}px)`;

}

/* IMAGE LOAD FIX */

window.addEventListener("load", ()=>{

const imgs = document.querySelectorAll("img");

let loaded = 0;

imgs.forEach(img=>{

if(img.complete){

loaded++;

}else{

img.onload = ()=>{

loaded++;

if(loaded === imgs.length){

update(false);

}

};

}

});

update(false);

});

window.onresize = ()=>{

update(false);

};

/* NAVIGATION */

function next(){

current++;
update();

}

function prev(){

current--;
update();

}

/* LOOP RESET */

track.addEventListener("transitionend", ()=>{

if(current === extended.length - 1){

current = 1;
update(false);

}

if(current === 0){

current = works.length;
update(false);

}

});

/* CLICK NAV */

document.getElementById("rightZone").onclick = next;
document.getElementById("leftZone").onclick = prev;

/* KEYBOARD */

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowRight") next();
if(e.key==="ArrowLeft") prev();

});

/* TRACKPAD SWIPE */

let wheelLock = false;

document.addEventListener("wheel",(e)=>{

if(Math.abs(e.deltaX) > 18){

if(wheelLock) return;

wheelLock = true;

if(e.deltaX > 0){

next();

}else{

prev();

}

setTimeout(()=>{

wheelLock = false;

},400);

}

},{passive:true});

/* TOUCH */

let startX = 0;

document.addEventListener("touchstart",(e)=>{

startX = e.touches[0].clientX;

});

document.addEventListener("touchend",(e)=>{

let endX = e.changedTouches[0].clientX;

if(endX < startX - 50){

next();

}

if(endX > startX + 50){

prev();

}

});

/* CLOSE OVERLAY */

document.getElementById("overlay").onclick = ()=>{

document.getElementById("overlay").style.display = "none";

};

</script>

</body>
</html>
