<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#f2f2ee;
  font-family:Arial, sans-serif;
  color:#111;
}

/* TITLE */
.title{
  position:fixed;
  top:12px;
  width:100%;
  text-align:center;
  font-size:14px;
  font-weight:bold;
  letter-spacing:1px;
  z-index:10;
}

/* LEFT MENU */
.menu{
  position:fixed;
  top:40px;
  left:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  font-size:14px;
  font-weight:bold;
  z-index:10;
}

.menu div{
  cursor:pointer;
}

/* MAIN VIEW */
.viewer{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  overflow:hidden;
}

/* TRACK */
.track{
  display:flex;
  align-items:flex-start;
  gap:40px;
  padding-left:120px;
  transition:transform 0.45s ease;
}

/* IMAGE BLOCK */
.work{
  flex-shrink:0;
}

/* IMAGES */
.work img{
  height:72vh;
  display:block;
  cursor:pointer;
  transition:transform 0.35s ease;
}

/* ZOOM */
.work img.active{
  transform:scale(1.15);
}

/* TEXT */
.caption{
  margin-top:10px;
  font-size:12px;
  line-height:1.4;
  text-align:left;
}
</style>
</head>

<body>

<div class="title">SELECTED WORKS</div>

<div class="menu">
  <div onclick="location.href='artist.html'">ARTIST</div>
  <div>SELECTED EXHIBITIONS + RESIDENCIES</div>
</div>

<div class="viewer">

  <div class="track" id="track">

    <div class="work">
      <img src="SR-rows">
      <div class="caption">
        Untitled (scatter)<br>
        Steel<br>
        375 sq. ft<br>
        2026
      </div>
    </div>

    <div class="work">
      <img src="SR-rows-D1">
      <div class="caption">
        Untitled (coil I)<br>
        Steel<br>
        12 in. D x 3.5 in. W<br>
        2024
      </div>
    </div>

    <div class="work">
      <img src="SR-rows-D2">
      <div class="caption">
        Untitled (coil IX)<br>
        Steel<br>
        23ft D x 1.6ft W<br>
        2026
      </div>
    </div>

    <div class="work">
      <img src="SR-rows-D3">
      <div class="caption">
        Detail<br>
        Untitled (coil IX)<br>
        Steel<br>
        23ft D x 1.6ft W<br>
        2026
      </div>
    </div>

  </div>

</div>

<script>

const track = document.getElementById("track");
const works = document.querySelectorAll(".work");

let current = 0;

/* position system */
function updateSlider(){

  const workWidth = works[0].offsetWidth + 40;

  track.style.transform =
    `translateX(${-current * workWidth}px)`;
}

/* infinite navigation */
function move(dir){

  current += dir;

  if(current < 0){
    current = works.length - 1;
  }

  if(current >= works.length){
    current = 0;
  }

  updateSlider();
}

/* click left/right side */
document.addEventListener("click", (e)=>{

  /* ignore menu clicks */
  if(e.target.closest(".menu")) return;

  if(e.clientX > window.innerWidth / 2){
    move(1);
  } else {
    move(-1);
  }
});

/* image zoom */
document.querySelectorAll("img").forEach(img=>{

  img.addEventListener("click", (e)=>{

    e.stopPropagation();

    document
      .querySelectorAll("img")
      .forEach(i => i.classList.remove("active"));

    img.classList.add("active");
  });
});

window.onload = updateSlider;

</script>

</body>
</html>
