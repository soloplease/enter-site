<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
background:#f8f8f4;
overflow:hidden;
font-family:Arial,sans-serif;
color:#111;
text-transform:uppercase;
}

/* NAME */

.name{
position:fixed;
top:16px;
left:24px;
font-size:18px;
font-weight:bold;
letter-spacing:.2px;
z-index:40;
}

/* LINKS */

.links{
position:fixed;
top:24px;
right:24px;
display:flex;
gap:22px;
z-index:40; /* IMPORTANT: stays normal layer */
}

.links a{
text-decoration:none;
color:#111;
font-size:11px;
transition:.2s ease;
}

.links a:hover{
font-weight:bold;
font-size:12px;
}

.links a.active{
font-style:italic;
}

/* VIEWER */

.viewer{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
padding-top:40px;
box-sizing:border-box;
}

/* TRACK */

.track{
display:flex;
align-items:flex-start;
gap:30px;
will-change:transform;
transition:transform .45s cubic-bezier(.22,.61,.36,1);
}

/* SLIDE */

.slide{
flex:none;
display:flex;
flex-direction:column;
align-items:flex-start;
}

/* IMAGE */

.imageWrap{
height:70vh;
display:flex;
align-items:center;
justify-content:center;
}

.imageWrap img{
max-height:70vh;
max-width:80vw;
width:auto;
height:auto;
display:block;
object-fit:contain;
cursor:zoom-in;
user-select:none;
-webkit-user-drag:none;
filter:grayscale(100%);
transition:filter .35s ease;
}

.slide.active img{
filter:grayscale(0%);
}

/* CAPTION */

.caption{
margin-top:10px;
font-size:11px;
line-height:1.4;
padding-left:2px;
}

/* NAV */

.nav{
position:fixed;
top:0;
width:12vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
z-index:50;
}

.nav.left{ left:0; }
.nav.right{ right:0; }

.arrow{
font-size:34px;
color:#b8b8b2;
opacity:.1;
transition:.2s ease;
pointer-events:none;
}

.nav:hover .arrow{
opacity:1;
transform:scale(1.12);
}

/* ZOOM ANIMATION CLONE */

.zoomClone{
position:fixed;
z-index:150;
pointer-events:none;
transition:transform .45s ease, opacity .45s ease;
will-change:transform;
}

/* =========================
   OVERLAY (FIXED MODAL)
========================= */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
display:none;
align-items:center;
justify-content:center;
z-index:1000; /* ABOVE EVERYTHING */
}

.overlay.active{
display:flex;
}

.overlayInner{
display:flex;
flex-direction:column;
align-items:center;
}

/* IMAGE */

.overlay img{
max-width:94vw;
max-height:84vh;
width:auto;
height:auto;
object-fit:contain;
}

/* OVERLAY NAV */

.overlayNav{
position:fixed;
top:0;
width:12vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:1010; /* above overlay */
}

.overlayNav.left{ left:0; }
.overlayNav.right{ right:0; }

.overlayArrow{
font-size:40px;
color:#f2f2ee;
opacity:.2;
transition:.2s ease;
pointer-events:none;
}

.overlayNav:hover .overlayArrow{
opacity:1;
transform:scale(1.12);
}

/* CAPTION */

.overlayCaption{
margin-top:14px;
font-size:11px;
line-height:1.4;
color:#f2f2ee;
text-align:center;
}

/* CLOSE */

.close{
position:absolute;
top:20px;
right:28px;
font-size:32px;
color:#f2f2ee;
cursor:pointer;
z-index:1020; /* highest */
}

</style>
</head>

<body>

<div class="name">SOLOMON ROUSSEAU</div>

<div class="links">
<a href="selected-works.html" class="active">SELECTED WORKS</a>
<a href="exhibitions.html">SELECTED EXHIBITIONS + RESIDENCIES</a>
<a href="acquisitions.html">ACQUISITIONS</a>
<a href="artist.html">ARTIST</a>
</div>

<div class="viewer">

<div class="nav left" onclick="prevSlide()"><div class="arrow">◀</div></div>
<div class="nav right" onclick="nextSlide()"><div class="arrow">▶</div></div>

<div class="track" id="track"></div>

</div>

<!-- OVERLAY -->

<div class="overlay" id="overlay">

<div class="overlayNav left" onclick="prevDetail(event)">
<div class="overlayArrow">◀</div>
</div>

<div class="overlayNav right" onclick="nextDetail(event)">
<div class="overlayArrow">▶</div>
</div>

<div class="close" onclick="closeOverlay()">×</div>

<div class="overlayInner">
<img id="detailImg">
<div class="overlayCaption" id="detailCaption"></div>
</div>

</div>

<script>

const works = [

{
title:"UNTITLED (ROWS)",
material:"STEEL",
size:"375 SQ. FT",
year:"2026",
images:[
"SR-rows.JPG",
"SR-rows-D1.JPG?v=4",
"SR-rows-D2.JPG",
"SR-rows-D3.JPG"
]
},

{
title:"UNTITLED (COIL I)",
material:"STEEL",
size:"VARIABLE",
year:"2024",
images:["SR-coil(I).webp"]
},

{
title:"UNTITLED (COIL IX)",
material:"STEEL",
size:"23FT",
year:"2026",
images:[
"SR-coil(IX).JPG",
"SR-coil(IX)-D1.JPG",
"SR-coil(IX)-D2.JPG"
]
},

{
title:"UNTITLED (SCATTER)",
material:"STEEL",
size:"375 SQ. FT",
year:"2026",
images:["SR-scatter.JPG","SR-scatter-D1.JPG"]
},

{
title:"UNTITLED (TUBES)",
material:"STEEL",
size:"VARIABLE",
year:"2026",
images:["SR-tubes.JPG","SR-tubes-D1.JPG"]
}

];

const track = document.getElementById("track");

function makeSlide(work,index){

const slide = document.createElement("div");
slide.className="slide";

slide.innerHTML = `
<div class="imageWrap">
<img src="${work.images[0]}">
</div>
<div class="caption">
<div><i>${work.title}</i></div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
</div>
`;

slide.querySelector("img").onclick = ()=>openOverlay(index);

return slide;
}

/* build loop */

const fullSet=[...works,...works,...works];

fullSet.forEach((w,i)=>{
track.appendChild(makeSlide(w,i%works.length));
});

const slides=document.querySelectorAll(".slide");
let current=works.length;

/* carousel */

function update(){
let offset=0;

for(let i=0;i<current;i++){
offset += slides[i].offsetWidth+30;
}

const center=(window.innerWidth/2)-(slides[current].offsetWidth/2);

track.style.transform=`translateX(${center-offset}px)`;

slides.forEach(s=>s.classList.remove("active"));
slides[current].classList.add("active");
}

function nextSlide(){ current++; update(); normalize(); }
function prevSlide(){ current--; update(); normalize(); }

function normalize(){
if(current>=works.length*2){ current-=works.length; update(); }
if(current<works.length){ current+=works.length; update(); }
}

/* overlay */

let activeWork;
let detailIndex=0;

function openOverlay(i){

activeWork=works[i%works.length];
detailIndex=0;

renderDetail();
document.getElementById("overlay").classList.add("active");
}

function renderDetail(){
document.getElementById("detailImg").src=activeWork.images[detailIndex];

document.getElementById("detailCaption").innerHTML=`
<div><i>${activeWork.title}</i></div>
<div>${activeWork.material}</div>
<div>${activeWork.size}</div>
<div>${activeWork.year}</div>
`;
}

function nextDetail(e){
e.stopPropagation();
detailIndex=(detailIndex+1)%activeWork.images.length;
renderDetail();
}

function prevDetail(e){
e.stopPropagation();
detailIndex=(detailIndex-1+activeWork.images.length)%activeWork.images.length;
renderDetail();
}

function closeOverlay(){
document.getElementById("overlay").classList.remove("active");
}

/* init */

window.addEventListener("load",update);
window.addEventListener("resize",update);

</script>

</body>
</html>
