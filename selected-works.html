<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
background:#f8f8f4;
overflow:hidden;

font-family:Arial,sans-serif;
color:#111;
text-transform:uppercase;
}

/* NAME */

.name{
position:fixed;
top:16px;
left:24px;

font-size:18px;
font-weight:bold;
letter-spacing:.2px;

z-index:40;
}

/* LINKS */

.links{
position:fixed;
top:24px;
right:24px;

display:flex;
gap:22px;

z-index:500;
}

.links a{
text-decoration:none;
color:#111;

font-size:11px;

transition:.2s ease;
}

.links a:hover{
font-weight:bold;
font-size:12px;
}

.links a.active{
font-style:italic;
}

/* VIEWER */

.viewer{
position:relative;

width:100vw;
height:100vh;

overflow:hidden;

display:flex;
align-items:center;

padding-top:40px;
box-sizing:border-box;
}

/* TRACK */

.track{
display:flex;
align-items:flex-start;

gap:30px;

will-change:transform;

transition:transform .45s cubic-bezier(.22,.61,.36,1);
}

/* SLIDE */

.slide{
flex:none;

display:flex;
flex-direction:column;
align-items:flex-start;
}

/* IMAGE */

.imageWrap{
height:70vh;

display:flex;
align-items:center;
justify-content:center;
}

.imageWrap img{
max-height:70vh;
max-width:80vw;

width:auto;
height:auto;

display:block;

object-fit:contain;

cursor:zoom-in;

user-select:none;
-webkit-user-drag:none;

filter:grayscale(100%);

transition:
filter .35s ease,
transform .35s ease;
}

/* ACTIVE CENTER IMAGE */

.slide.active img{
filter:grayscale(0%);
}

/* CAPTION */

.caption{
margin-top:10px;

font-size:11px;
line-height:1.4;

padding-left:2px;
}

/* NAVIGATION */

.nav{
position:fixed;
top:0;

width:12vw;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

z-index:50;
}

.nav.left{
left:0;
}

.nav.right{
right:0;
}

.arrow{
font-size:34px;

color:#b8b8b2;

opacity:.1;

transition:.2s ease;

pointer-events:none;
}

.nav:hover .arrow{
opacity:1;
transform:scale(1.12);
}

/* ZOOM CLONE */

.zoomClone{
position:fixed;

z-index:150;

pointer-events:none;

will-change:transform;

transition:
transform .45s cubic-bezier(.22,.61,.36,1),
opacity .45s ease;
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;

background:rgba(0,0,0,.92);

display:none;
align-items:center;
justify-content:center;

z-index:200;
}

.overlay.active{
display:flex;
}

.overlayInner{
display:flex;
flex-direction:column;
align-items:center;
}

/* OVERLAY IMAGE */

.overlay img{
max-width:94vw;
max-height:84vh;

width:auto;
height:auto;

object-fit:contain;
}

/* OVERLAY NAV */

.overlayNav{
position:fixed;
top:0;

width:12vw;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

z-index:210;
}

.overlayNav.left{
left:0;
}

.overlayNav.right{
right:0;
}

.overlayArrow{
font-size:40px;

color:#f2f2ee;

opacity:.2;

transition:.2s ease;

pointer-events:none;
}

.overlayNav:hover .overlayArrow{
opacity:1;
transform:scale(1.12);
}

/* OVERLAY CAPTION */

.overlayCaption{
margin-top:14px;

font-size:11px;
line-height:1.4;

color:#f2f2ee;

text-align:center;
}

/* CLOSE */

.close{
position:absolute;
top:20px;
right:28px;

font-size:32px;

color:#f2f2ee;

cursor:pointer;

z-index:300;
}

</style>
</head>

<body>

<div class="name">
SOLOMON ROUSSEAU
</div>

<div class="links">

<a href="selected-works.html" class="active">
SELECTED WORKS
</a>

<a href="exhibitions.html">
SELECTED EXHIBITIONS + RESIDENCIES
</a>

<a href="acquisitions.html">
ACQUISITIONS
</a>

<a href="artist.html">
ARTIST
</a>

</div>

<div class="viewer">

<div class="nav left" onclick="prevSlide()">
<div class="arrow">◀</div>
</div>

<div class="nav right" onclick="nextSlide()">
<div class="arrow">▶</div>
</div>

<div class="track" id="track"></div>

</div>

<!-- OVERLAY -->

<div class="overlay" id="overlay">

<div class="overlayNav left" onclick="prevDetail(event)">
<div class="overlayArrow">◀</div>
</div>

<div class="overlayNav right" onclick="nextDetail(event)">
<div class="overlayArrow">▶</div>
</div>

<div class="close" onclick="closeOverlay()">×</div>

<div class="overlayInner">

<img id="detailImg">

<div class="overlayCaption" id="detailCaption"></div>

</div>

</div>

<script>

/* =========================================
   WORKS
========================================= */

const works = [

{
title:"UNTITLED (ROWS)",
material:"STEEL",
size:"375 SQ. FT",
year:"2026",

images:[
"SR-rows.JPG",
"SR-rows-D1.JPG?v=4",
"SR-rows-D2.JPG",
"SR-rows-D3.JPG"
]
},

{
title:"UNTITLED (COIL I)",
material:"STEEL",
size:"VARIABLE DIMENSIONS",
year:"2024",

images:[
"SR-coil(I).webp"
]
},

{
title:"UNTITLED (COIL IX)",
material:"STEEL",
size:"23FT D × 1.6FT W",
year:"2026",

images:[
"SR-coil(IX).JPG",
"SR-coil(IX)-D1.JPG",
"SR-coil(IX)-D2.JPG"
]
},

{
title:"UNTITLED (ROLLS INSTALLATION)",
material:"STEEL",
size:"VARIABLE DIMENSIONS",
year:"2026",

images:[
"SR-rollsinstall.jpeg",
"SR-rolls-D1.jpeg",
"SR-rolls-D2.jpeg"
]
},

{
title:"UNTITLED (SCATTER)",
material:"STEEL",
size:"375 SQ. FT",
year:"2026",

images:[
"SR-scatter.JPG",
"SR-scatter-D1.JPG"
]
},

{
title:"UNTITLED (STACK)",
material:"STEEL",
size:"VARIABLE DIMENSIONS",
year:"2026",

images:[
"SR-stack.JPG"
]
},

{
title:"UNTITLED (TUBES)",
material:"STEEL",
size:"VARIABLE DIMENSIONS",
year:"2026",

images:[
"SR-tubes.JPG",
"SR-tubes-D1.JPG"
]
}

];

/* =========================================
   BUILD INFINITE TRACK
========================================= */

const track =
document.getElementById("track");

function makeSlide(work,index){

const slide =
document.createElement("div");

slide.className = "slide";

slide.innerHTML = `

<div class="imageWrap">
<img src="${work.images[0]}">
</div>

<div class="caption">
<div><i>${work.title}</i></div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
</div>

`;

slide
.querySelector("img")
.onclick = ()=>{

openOverlay(index);

};

return slide;

}

/* TRUE LOOP */

const fullSet = [
...works,
...works,
...works
];

fullSet.forEach((work,i)=>{

track.appendChild(
makeSlide(work,i % works.length)
);

});

const slides =
document.querySelectorAll(".slide");

let current = works.length;

/* =========================================
   POSITION
========================================= */

function update(animate=true){

track.style.transition =
animate
? "transform .45s cubic-bezier(.22,.61,.36,1)"
: "none";

let offset = 0;

for(let i=0;i<current;i++){

offset +=
slides[i].offsetWidth + 30;

}

const activeWidth =
slides[current].offsetWidth;

const center =
(window.innerWidth / 2) -
(activeWidth / 2);

track.style.transform =
`translateX(${center - offset}px)`;

/* ACTIVE */

slides.forEach(s=>{

s.classList.remove("active");

});

slides[current]
.classList.add("active");

}

/* NORMALIZE */

function normalize(){

if(current >= works.length * 2){

current -= works.length;

update(false);

}

if(current < works.length){

current += works.length;

update(false);

}

}

/* NEXT / PREV */

function nextSlide(){

current++;

update();

setTimeout(normalize,460);

}

function prevSlide(){

current--;

update();

setTimeout(normalize,460);

}

/* TRACKPAD */

let wheelLock = false;

window.addEventListener("wheel",(e)=>{

if(Math.abs(e.deltaX) > 18){

if(wheelLock) return;

wheelLock = true;

if(e.deltaX > 0){

nextSlide();

}else{

prevSlide();

}

setTimeout(()=>{

wheelLock = false;

},420);

}

},{passive:true});

/* TOUCH */

let startX = 0;

window.addEventListener("touchstart",(e)=>{

startX = e.touches[0].clientX;

});

window.addEventListener("touchend",(e)=>{

let endX = e.changedTouches[0].clientX;

if(startX - endX > 50){

nextSlide();

}

if(endX - startX > 50){

prevSlide();

}

});

/* =========================================
   DETAIL OVERLAY
========================================= */

let activeWork = null;
let detailIndex = 0;

function openOverlay(index){

const actualIndex =
index % works.length;

const imgEl =
slides[index]
.querySelector("img");

const rect =
imgEl.getBoundingClientRect();

/* CLONE */

const clone =
imgEl.cloneNode(true);

clone.classList.add("zoomClone");

clone.style.top =
rect.top + "px";

clone.style.left =
rect.left + "px";

clone.style.width =
rect.width + "px";

clone.style.height =
rect.height + "px";

document.body.appendChild(clone);

/* ANIMATE */

requestAnimationFrame(()=>{

clone.style.transform =
`translate(
${window.innerWidth/2 - rect.left - rect.width/2}px,
${window.innerHeight/2 - rect.top - rect.height/2}px
)
scale(2)`;

clone.style.opacity = "0";

});

/* OPEN */

setTimeout(()=>{

clone.remove();

activeWork =
works[actualIndex];

detailIndex = 0;

renderDetail();

document
.getElementById("overlay")
.classList.add("active");

},350);

}

/* RENDER */

function renderDetail(){

document
.getElementById("detailImg")
.src =
activeWork.images[detailIndex];

document
.getElementById("detailCaption")
.innerHTML = `

<div><i>${activeWork.title}</i></div>
<div>${activeWork.material}</div>
<div>${activeWork.size}</div>
<div>${activeWork.year}</div>

`;

}

/* DETAIL NAV */

function nextDetail(e){

e.stopPropagation();

detailIndex =
(detailIndex + 1)
% activeWork.images.length;

renderDetail();

}

function prevDetail(e){

e.stopPropagation();

detailIndex =
(detailIndex - 1 + activeWork.images.length)
% activeWork.images.length;

renderDetail();

}

/* CLOSE */

function closeOverlay(){

document
.getElementById("overlay")
.classList.remove("active");

}

/* OUTSIDE CLICK */

document
.getElementById("overlay")
.addEventListener("click",(e)=>{

if(e.target.id === "overlay"){

closeOverlay();

}

});

/* INIT */

window.addEventListener(
"load",
()=>{

update(false);

}
);

window.addEventListener(
"resize",
()=>{

update(false);

}
);

</script>

</body>
</html>
