<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
background:#f2f2ee;
overflow:hidden;
font-family:Arial,sans-serif;
color:#111;
}

/* TITLE */

.title{
position:fixed;
top:18px;
width:100%;
text-align:center;
font-size:18px;
font-weight:bold;
letter-spacing:.5px;
z-index:30;
}

/* LINKS */

.links{
position:fixed;
top:20px;
left:24px;

display:flex;
gap:24px;

z-index:30;
}

.links a{
text-decoration:none;
color:#111;
font-size:13px;
font-style:italic;
}

/* VIEWER */

.viewer{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

display:flex;
align-items:center;
}

/* TRACK */

.track{
display:flex;
align-items:flex-start;
gap:6px;

will-change:transform;

transition:transform .45s cubic-bezier(.22,.61,.36,1);
}

/* SLIDE */

.slide{
flex:none;

display:flex;
flex-direction:column;
align-items:flex-start;
}

/* IMAGE */

.imageWrap{
height:70vh;

display:flex;
align-items:center;
justify-content:center;
}

.imageWrap img{
height:70vh;
width:auto;

display:block;
object-fit:contain;

cursor:zoom-in;

user-select:none;
-webkit-user-drag:none;
}

/* CAPTION */

.caption{
margin-top:8px;
font-size:11px;
line-height:1.35;
padding-left:2px;
}

/* NAV */

.nav{
position:fixed;
top:0;
width:15vw;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

z-index:40;
}

.nav.left{
left:0;
}

.nav.right{
right:0;
}

.arrow{
font-size:20px;
opacity:0;
transition:.2s;
pointer-events:none;
}

.nav:hover .arrow{
opacity:.35;
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;

background:rgba(0,0,0,.9);

display:none;
align-items:center;
justify-content:center;

z-index:100;
}

.overlay.active{
display:flex;
}

.overlayInner{
display:flex;
flex-direction:column;
align-items:flex-start;
}

.overlay img{
max-width:94vw;
max-height:86vh;
object-fit:contain;
}

.overlayCaption{
margin-top:12px;
font-size:12px;
line-height:1.45;
color:#f2f2ee;
}

.close{
position:absolute;
top:20px;
right:24px;
font-size:28px;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div class="title">
SELECTED WORKS
</div>

<div class="links">
<a href="artist.html">Artist</a>
<a href="exhibitions.html">Selected Exhibitions + Residencies</a>
</div>

<div class="viewer">

<div class="nav left" onclick="prevSlide()">
<div class="arrow">◀</div>
</div>

<div class="nav right" onclick="nextSlide()">
<div class="arrow">▶</div>
</div>

<div class="track" id="track"></div>

</div>

<!-- OVERLAY -->

<div class="overlay" id="overlay" onclick="closeZoom()">

<div class="close">×</div>

<div class="overlayInner">

<img id="zoomed">

<div class="overlayCaption" id="overlayCaption"></div>

</div>

</div>

<script>

const works = [

{
img:"SR-rows.JPG",
title:"Untitled (scatter)",
material:"Steel",
size:"375 sq. ft",
year:"2026"
},

{
img:"SR-rows-D1.JPG?v=3",
title:"Detail — Untitled (scatter)",
material:"Steel",
size:"375 sq. ft",
year:"2026"
},

{
img:"SR-rows-D2.JPG",
title:"Untitled (coil I)",
material:"Steel",
size:"12 in. D x 3.5 in. W",
year:"2024"
},

{
img:"SR-rows-D3.JPG",
title:"Untitled (coil IX)",
material:"Steel",
size:"23ft D x 1.6ft W",
year:"2026"
}

];

const track = document.getElementById("track");

/* BUILD */

function makeSlide(work){

const slide = document.createElement("div");

slide.className = "slide";

slide.innerHTML = `

<div class="imageWrap">
<img src="${work.img}">
</div>

<div class="caption">
<div><i>${work.title}</i></div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
</div>

`;

slide.querySelector("img").onclick = ()=>{

openZoom(work);

};

return slide;

}

/* TRIPLE SET FOR TRUE INFINITE LOOP */

const fullSet = [
...works,
...works,
...works
];

fullSet.forEach(work=>{

track.appendChild(makeSlide(work));

});

const slides = document.querySelectorAll(".slide");

let current = works.length;

/* POSITION */

function update(animate=true){

track.style.transition =
animate
? "transform .45s cubic-bezier(.22,.61,.36,1)"
: "none";

let offset = 0;

for(let i=0;i<current;i++){

offset += slides[i].offsetWidth + 6;

}

const activeWidth = slides[current].offsetWidth;

const center =
(window.innerWidth / 2) -
(activeWidth / 2);

track.style.transform =
`translateX(${center - offset}px)`;

}

/* RESET LOOP */

function normalize(){

if(current >= works.length * 2){

current -= works.length;
update(false);

}

if(current < works.length){

current += works.length;
update(false);

}

}

/* NAVIGATION */

function nextSlide(){

current++;

update();

setTimeout(normalize,460);

}

function prevSlide(){

current--;

update();

setTimeout(normalize,460);

}

/* START */

window.addEventListener("load", ()=>{

update(false);

});

window.addEventListener("resize", ()=>{

update(false);

});

/* TRACKPAD */

let wheelLock = false;

window.addEventListener("wheel",(e)=>{

if(Math.abs(e.deltaX) > 18){

if(wheelLock) return;

wheelLock = true;

if(e.deltaX > 0){

nextSlide();

}else{

prevSlide();

}

setTimeout(()=>{

wheelLock = false;

},420);

}

},{passive:true});

/* TOUCH */

let startX = 0;

window.addEventListener("touchstart",(e)=>{

startX = e.touches[0].clientX;

});

window.addEventListener("touchend",(e)=>{

let endX = e.changedTouches[0].clientX;

if(startX - endX > 50){

nextSlide();

}

if(endX - startX > 50){

prevSlide();

}

});

/* KEYS */

window.addEventListener("keydown",(e)=>{

if(e.key==="ArrowRight") nextSlide();

if(e.key==="ArrowLeft") prevSlide();

});

/* ZOOM */

function openZoom(work){

document.getElementById("overlay").classList.add("active");

document.getElementById("zoomed").src = work.img;

document.getElementById("overlayCaption").innerHTML = `
<div><i>${work.title}</i></div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
`;

}

function closeZoom(){

document.getElementById("overlay").classList.remove("active");

}

</script>

</body>
</html>
