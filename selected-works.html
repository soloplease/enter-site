<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
background:#f8f8f4;
overflow:hidden;
font-family:Arial,sans-serif;
color:#111;
text-transform:uppercase;
}

/* ARTIST NAME */

.name{
position:fixed;
top:16px;
left:24px;

font-size:18px;
font-weight:bold;
letter-spacing:.2px;

z-index:40;
}

/* LINKS */

.links{
position:fixed;
top:24px;
right:24px;

display:flex;
gap:22px;

z-index:40;
}

.links a{
text-decoration:none;
color:#111;

/* MATCH CAPTION SIZE */
font-size:11px;

font-style:normal;
transition:all .2s ease;
}

/* HOVER STATE: BOLD + SIZE UP */

.links a:hover{
font-weight:bold;
font-size:12px;
}

/* ACTIVE PAGE */

.links a.active{
font-style:italic;
}

/* VIEWER */

.viewer{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

display:flex;
align-items:center;

padding-top:40px;
box-sizing:border-box;
}

/* TRACK */

.track{
display:flex;
align-items:flex-start;
gap:30px;

will-change:transform;
transition:transform .45s cubic-bezier(.22,.61,.36,1);
}

/* SLIDE */

.slide{
flex:none;
display:flex;
flex-direction:column;
align-items:flex-start;
}

/* IMAGE WRAP */

.imageWrap{
height:70vh;

display:flex;
align-items:center;
justify-content:center;
}

/* KEY FIX: NO CROPPING */

.imageWrap img{
height:auto;
max-height:70vh;
width:auto;
max-width:80vw;

display:block;
object-fit:contain;

cursor:zoom-in;

user-select:none;
-webkit-user-drag:none;

filter:grayscale(100%);
transition:filter .35s ease;
}

/* ACTIVE IMAGE */

.slide.active img{
filter:grayscale(0%);
}

/* CAPTION */

.caption{
margin-top:10px;
font-size:11px;
line-height:1.4;
padding-left:2px;
}

/* NAV */

.nav{
position:fixed;
top:0;
width:18vw;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

z-index:50;
}

.nav.left{ left:0; }
.nav.right{ right:0; }

/* ARROWS */

.arrow{
font-size:34px;
color:#b8b8b2;

opacity:.10;
transition:.2s ease;

pointer-events:none;
user-select:none;
}

/* HOVER BRIGHTNESS */

.nav:hover .arrow{
opacity:1;
transform:scale(1.12);
text-shadow:0 0 12px rgba(0,0,0,.35);
}

/* OVERLAY */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);

display:none;
align-items:center;
justify-content:center;

z-index:120;
}

.overlay.active{
display:flex;
}

.overlayInner{
display:flex;
flex-direction:column;
align-items:flex-start;
}

.overlay img{
max-width:94vw;
max-height:84vh;
object-fit:contain;
}

.overlayCaption{
margin-top:14px;
font-size:12px;
line-height:1.45;
color:#f2f2ee;
}

/* OVERLAY NAV */

.overlayNav{
position:fixed;
top:0;
width:18vw;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

z-index:130;
}

.overlayNav.left{ left:0; }
.overlayNav.right{ right:0; }

.overlayArrow{
font-size:40px;
color:#f2f2ee;

opacity:.14;
transition:.18s ease;

pointer-events:none;
}

/* OVERLAY HOVER */

.overlayNav:hover .overlayArrow{
opacity:1;
transform:scale(1.12);
text-shadow:0 0 18px rgba(255,255,255,.35);
}

/* CLOSE */

.close{
position:absolute;
top:20px;
right:28px;

font-size:32px;
color:#f2f2ee;

cursor:pointer;
z-index:200;
}

</style>
</head>

<body>

<div class="name">SOLOMON ROUSSEAU</div>

<div class="links">
<a href="selected-works.html" class="active">SELECTED WORKS</a>
<a href="exhibitions.html">SELECTED EXHIBITIONS + RESIDENCIES</a>
<a href="artist.html">ARTIST</a>
</div>

<div class="viewer">

<div class="nav left" onclick="prevSlide()">
<div class="arrow">◀</div>
</div>

<div class="nav right" onclick="nextSlide()">
<div class="arrow">▶</div>
</div>

<div class="track" id="track"></div>

</div>

<!-- OVERLAY -->

<div class="overlay" id="overlay">

<div class="overlayNav left" onclick="overlayPrev(event)">
<div class="overlayArrow">◀</div>
</div>

<div class="overlayNav right" onclick="overlayNext(event)">
<div class="overlayArrow">▶</div>
</div>

<div class="close" onclick="closeZoom()">×</div>

<div class="overlayInner">

<img id="zoomed">

<div class="overlayCaption" id="overlayCaption"></div>

</div>

</div>

<script>

const works = [
{ img:"SR-rows.JPG", title:"UNTITLED (SCATTER)", material:"STEEL", size:"375 SQ. FT", year:"2026" },
{ img:"SR-rows-D1.JPG?v=4", title:"DETAIL — UNTITLED (SCATTER)", material:"STEEL", size:"375 SQ. FT", year:"2026" },
{ img:"SR-rows-D2.JPG", title:"UNTITLED (COIL I)", material:"STEEL", size:"12 IN. D x 3.5 IN. W", year:"2024" },
{ img:"SR-rows-D3.JPG", title:"UNTITLED (COIL IX)", material:"STEEL", size:"23FT D x 1.6FT W", year:"2026" }
];

const track = document.getElementById("track");

function makeSlide(work,index){

const slide = document.createElement("div");
slide.className = "slide";

slide.innerHTML = `
<div class="imageWrap">
<img src="${work.img}">
</div>

<div class="caption">
<div><i>${work.title}</i></div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
</div>
`;

slide.querySelector("img").onclick = ()=> openZoom(index);

return slide;
}

/* BUILD */

const fullSet = [...works,...works,...works];

fullSet.forEach((work,i)=>{
track.appendChild(makeSlide(work,i % works.length));
});

const slides = document.querySelectorAll(".slide");

let current = works.length;

/* UPDATE */

function update(animate=true){

track.style.transition =
animate
? "transform .45s cubic-bezier(.22,.61,.36,1)"
: "none";

slides.forEach(s => s.classList.remove("active"));
slides[current].classList.add("active");

let offset = 0;

for(let i=0;i<current;i++){
offset += slides[i].offsetWidth + 30;
}

const activeWidth = slides[current].offsetWidth;

const center =
(window.innerWidth / 2) - (activeWidth / 2);

track.style.transform =
`translateX(${center - offset}px)`;
}

/* LOOP */

function normalize(){

if(current >= works.length * 2){
current -= works.length;
update(false);
}

if(current < works.length){
current += works.length;
update(false);
}
}

/* NAV */

function nextSlide(){
current++;
update();
setTimeout(normalize,460);
}

function prevSlide(){
current--;
update();
setTimeout(normalize,460);
}

/* INIT */

window.addEventListener("load", ()=> update(false));
window.addEventListener("resize", ()=> update(false));

/* ZOOM */

let overlayIndex = 0;

function openZoom(index){
overlayIndex = index;
document.getElementById("overlay").classList.add("active");
renderOverlay();
}

function renderOverlay(){

const work = works[overlayIndex];

document.getElementById("zoomed").src = work.img;

document.getElementById("overlayCaption").innerHTML = `
<div><i>${work.title}</i></div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
`;
}

function overlayNext(e){
e.stopPropagation();
overlayIndex = (overlayIndex + 1) % works.length;
renderOverlay();
}

function overlayPrev(e){
e.stopPropagation();
overlayIndex = (overlayIndex - 1 + works.length) % works.length;
renderOverlay();
}

function closeZoom(){
document.getElementById("overlay").classList.remove("active");
}

document.getElementById("overlay").addEventListener("click",(e)=>{
if(e.target.id === "overlay") closeZoom();
});

</script>

</body>
</html>
