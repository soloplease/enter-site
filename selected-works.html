<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
overflow:hidden;
background:#f2f2ee;
font-family:Arial,sans-serif;
color:#111;
cursor:default;
}

/* TITLE */

.title{
position:fixed;
top:14px;
left:50%;
transform:translateX(-50%);
font-size:14px;
font-weight:bold;
z-index:30;
}

/* SIDEBAR */

.sidebar{
position:fixed;
top:14px;
left:22px;
display:flex;
flex-direction:column;
gap:8px;
z-index:30;
}

.sidebar a{
text-decoration:none;
color:#111;
font-size:13px;
font-style:italic;
font-weight:normal;
}

/* VIEWPORT */

.viewport{
width:100vw;
height:100vh;
overflow:hidden;
position:relative;
display:flex;
align-items:center;
}

/* TRACK */

.track{
display:flex;
align-items:center;
gap:8px;
will-change:transform;
transition:transform .45s cubic-bezier(.22,.61,.36,1);
}

/* SLIDE */

.slide{
flex:none;
width:92vw;
display:flex;
flex-direction:column;
justify-content:center;
}

/* IMAGE */

.imageWrap{
height:80vh;
display:flex;
align-items:center;
justify-content:center;
}

.imageWrap img{
max-height:80vh;
max-width:92vw;
object-fit:contain;
cursor:zoom-in;

transition:transform .25s ease;

user-select:none;
-webkit-user-drag:none;
}

.imageWrap img:hover{
transform:scale(1.005);
}

/* CAPTION */

.caption{
margin-top:12px;
font-size:13px;
line-height:1.45;
padding-left:6px;
}

/* OVERLAY */

#overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.94);

display:none;
align-items:center;
justify-content:center;

z-index:100;
}

#overlayInner{
display:flex;
flex-direction:column;
align-items:flex-start;
}

#overlayImg{
max-width:96vw;
max-height:88vh;
object-fit:contain;
}

#overlayCaption{
margin-top:14px;
font-size:13px;
line-height:1.5;
color:#f2f2ee;
}

/* NAVIGATION ARROWS */

.arrow{
position:fixed;
top:50%;
transform:translateY(-50%);
font-size:24px;
color:#111;
opacity:0;
transition:opacity .2s ease;
z-index:60;
pointer-events:none;
}

.arrow.left{
left:18px;
}

.arrow.right{
right:18px;
}

body:hover .arrow{
opacity:.06;
}

#leftZone:hover ~ .arrow.left{
opacity:.55;
}

#rightZone:hover ~ .arrow.right{
opacity:.55;
}

/* NAV ZONES */

#leftZone,
#rightZone{
position:fixed;
top:0;
width:15vw;
height:100vh;
z-index:50;
}

#leftZone{
left:0;
}

#rightZone{
right:0;
}

</style>
</head>

<body>

<div class="title">
SELECTED WORKS
</div>

<div class="sidebar">
<a href="artist.html">Artist</a>
<a href="#">Selected Exhibitions + Residencies</a>
</div>

<div class="viewport">

<div class="track" id="track"></div>

</div>

<div id="leftZone"></div>
<div id="rightZone"></div>

<div class="arrow left">◀</div>
<div class="arrow right">▶</div>

<div id="overlay">

<div id="overlayInner">

<img id="overlayImg">

<div id="overlayCaption"></div>

</div>

</div>

<script>

const works = [

{
img:"SR-rows.JPG",
title:"Untitled (scatter)",
material:"Steel",
size:"375 sq. ft",
year:"2026"
},

{
img:"SR-rows-D1.JPG",
title:"Untitled (coil I)",
material:"Steel",
size:"12 in. D x 3.5 in. W",
year:"2024"
},

{
img:"SR-rows-D2.JPG",
title:"Untitled (coil IX)",
material:"Steel",
size:"23ft D x 1.6ft W",
year:"2026"
},

{
img:"SR-rows-D3.JPG",
title:"Detail — Untitled (coil IX)",
material:"Steel",
size:"23ft D x 1.6ft W",
year:"2026"
}

];

const track = document.getElementById("track");

let current = 1;

/* BUILD INFINITE TRACK */

function createSlide(work){

const slide = document.createElement("div");

slide.className = "slide";

slide.innerHTML = `

<div class="imageWrap">
<img src="${work.img}">
</div>

<div class="caption">
<div>${work.title}</div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
</div>

`;

const img = slide.querySelector("img");

img.addEventListener("click", ()=>{

document.getElementById("overlay").style.display = "flex";

document.getElementById("overlayImg").src = work.img;

document.getElementById("overlayCaption").innerHTML = `
<div>${work.title}</div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
`;

});

return slide;

}

/* CLONE SYSTEM */

const extended = [
works[works.length - 1],
...works,
works[0]
];

extended.forEach(work=>{

track.appendChild(createSlide(work));

});

function update(animate=true){

if(!animate){
track.style.transition = "none";
}else{
track.style.transition =
"transform .45s cubic-bezier(.22,.61,.36,1)";
}

track.style.transform =
`translateX(calc(-${current * 92}vw - ${current * 8}px + 4vw))`;

}

update(false);

function next(){

current++;

update();

}

function prev(){

current--;

update();

}

/* LOOP RESET */

track.addEventListener("transitionend", ()=>{

if(current === extended.length - 1){

current = 1;

update(false);

}

if(current === 0){

current = works.length;

update(false);

}

});

/* CLICK NAV */

document.getElementById("rightZone").onclick = next;

document.getElementById("leftZone").onclick = prev;

/* KEYBOARD */

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowRight") next();

if(e.key==="ArrowLeft") prev();

});

/* TRACKPAD SWIPE */

let wheelLock = false;

document.addEventListener("wheel",(e)=>{

if(Math.abs(e.deltaX) > 18){

if(wheelLock) return;

wheelLock = true;

if(e.deltaX > 0){

next();

}else{

prev();

}

setTimeout(()=>{

wheelLock = false;

},420);

}

},{passive:true});

/* TOUCH */

let startX = 0;

document.addEventListener("touchstart",(e)=>{

startX = e.touches[0].clientX;

});

document.addEventListener("touchend",(e)=>{

let endX = e.changedTouches[0].clientX;

if(endX < startX - 50){

next();

}

if(endX > startX + 50){

prev();

}

});

/* CLOSE OVERLAY */

document.getElementById("overlay").onclick = ()=>{

document.getElementById("overlay").style.display = "none";

};

</script>

</body>
</html>
