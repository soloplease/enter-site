<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
background:#f8f8f4;
overflow:hidden;
font-family:Arial,sans-serif;
text-transform:uppercase;
color:#111;
cursor:default;
}

/* NAME */
.name{
position:fixed;
top:16px;
left:24px;
font-size:18px;
font-weight:bold;
z-index:40;
}

/* LINKS */
.links{
position:fixed;
top:24px;
right:24px;
display:flex;
gap:22px;
z-index:300;
}

.links a{
text-decoration:none;
color:#111;
font-size:11px;
transition:.2s ease;
cursor:pointer;
}

.links a:hover{
font-weight:bold;
font-size:12px;
}

.links a.active{
font-style:italic;
}

/* VIEWER */
.viewer{
position:relative;
width:100vw;
height:100vh;
display:flex;
align-items:center;
overflow:hidden;
}

/* TRACK */
.track{
display:flex;
gap:30px;
will-change:transform;
transition:transform .55s cubic-bezier(.22,.61,.36,1);
}

/* SLIDES */
.slide{
flex:none;
display:flex;
flex-direction:column;
align-items:flex-start;
}

/* IMAGE WRAP */
.imageWrap{
height:70vh;
display:flex;
align-items:center;
justify-content:center;
}

.imageWrap img{
max-height:70vh;
max-width:80vw;
object-fit:contain;
user-select:none;
-webkit-user-drag:none;
cursor:zoom-in;
transition:filter .3s ease, transform .3s ease;
filter:grayscale(100%);
}

/* CENTER ACTIVE IMAGE */
.slide.active img{
filter:grayscale(0%);
}

/* CAPTION */
.caption{
margin-top:10px;
font-size:11px;
line-height:1.4;
}

/* =========================
   NAVIGATION ARROWS
========================= */

.nav{
position:fixed;
top:0;
width:140px;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
z-index:60;
pointer-events:none;
}

.nav.left{left:0;}
.nav.right{right:0;}

.arrow{
font-size:46px;
color:#cfcfcf;   /* visible even idle */
opacity:0.9;
transition:.25s ease;
pointer-events:auto;
user-select:none;
}

/* STRONG HOVER EMPHASIS */
.nav:hover .arrow{
color:#ffffff;
opacity:1;
transform:scale(1.2);
}

/* =========================
   OVERLAY
========================= */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
}

.overlay.active{
display:flex;
}

/* overlay image constraint */
.overlayInner{
display:flex;
flex-direction:column;
align-items:center;
}

.overlay img{
max-width:92vw;
max-height:82vh;
width:auto;
height:auto;
object-fit:contain;
display:block;
}

/* overlay nav */
.overlayNav{
position:fixed;
top:0;
width:140px;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
z-index:1010;
cursor:pointer;
}

.overlayNav.left{left:0;}
.overlayNav.right{right:0;}

.overlayArrow{
font-size:46px;
color:#fff;
opacity:0.35;
transition:.2s ease;
}

.overlayNav:hover .overlayArrow{
opacity:1;
transform:scale(1.2);
}

/* CLOSE */
.close{
position:absolute;
top:20px;
right:28px;
font-size:34px;
color:#fff;
cursor:pointer;
z-index:1100;
}

/* CAPTION */
.overlayCaption{
margin-top:14px;
font-size:11px;
color:#fff;
text-align:center;
}

</style>
</head>

<body>

<div class="name">SOLOMON ROUSSEAU</div>

<div class="links">
<a href="selected-works.html" class="active">SELECTED WORKS</a>
<a href="exhibitions.html">SELECTED EXHIBITIONS + RESIDENCIES</a>
<a href="acquisitions.html">ACQUISITIONS</a>
<a href="artist.html">ARTIST</a>
</div>

<div class="viewer">
<div class="nav left" onclick="prev()"><div class="arrow">◀</div></div>
<div class="nav right" onclick="next()"><div class="arrow">▶</div></div>
<div class="track" id="track"></div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay">

<div class="overlayNav left" onclick="prevDetail(event)">
<div class="overlayArrow">◀</div>
</div>

<div class="overlayNav right" onclick="nextDetail(event)">
<div class="overlayArrow">▶</div>
</div>

<div class="close" onclick="closeOverlay()">×</div>

<div class="overlayInner">
<img id="overlayImg">
<div class="overlayCaption" id="caption"></div>
</div>

</div>

<script>

/* =========================
   WORKS
========================= */

const works = [
{
title:"ROWS",
images:[
"SR-rows-D1.JPG",
"SR-rows-scale.JPG",
"SR-rows-D2.JPG",
"SR-rows-D3.JPG",
"SR-rows.JPG"
]
},
{
title:"COIL I",
images:["SR-coil(I).webp"]
},
{
title:"COIL IX",
images:[
"SR-coil(IX)-scale.JPG,
"SR-coil(IX)-D1.JPG",
"SR-coil(IX)-D2.JPG",
"SR-coil(IX)-D3.JPG",
"SR-coil(IX)-D4.JPG",
"SR-coil(IX)-D5.JPG",
"SR-coil(IX).JPG"
]
},
{
title:"ROLLS INSTALLATION",
images:[
"SR-rolls-D1.jpeg",
"SR-rolls-D2.jpeg",
"IMG_4049.PNG",
"SR-rollsinstall.jpeg"
]
},
{
title:"SCATTER",
images:[
"SR-scatter-D1.JPG",
"SR-scatter-scale.JPG",
"SR-scatter.JPG",
"SR-scatter-D2.JPG",
"SR-scatter-D3.JPG",
"SR-scatter-D4.JPG"
]
},
{
title:"STACK",
images:["SR-stack.JPG"]
},
{
title:"TUBES",
images:[
"SR-tubes-D1.JPG",
"SR-tubes.JPG",
"SR-tube-scale.JPG"
]
}
];

/* =========================
   TRUE INFINITE LOOP
========================= */

const track = document.getElementById("track");

/* large buffer for seamless motion */
const loop = [];
for(let i=0;i<20;i++){
loop.push(...works);
}

loop.forEach((w,i)=>{
const slide = document.createElement("div");
slide.className = "slide";

slide.innerHTML = `
<div class="imageWrap">
<img src="${w.images[w.images.length-1]}">
</div>

<div class="caption">
<div><i>${w.title}</i></div>
</div>
`;

slide.querySelector("img").onclick = () => openOverlay(i % works.length);

track.appendChild(slide);
});

const slides = document.querySelectorAll(".slide");

let current = Math.floor(loop.length/2) + 2;

/* =========================
   POSITIONING
========================= */

function render(){

let offset = 0;

for(let i=0;i<current;i++){
offset += slides[i].offsetWidth + 30;
}

const center =
(window.innerWidth/2) -
(slides[current].offsetWidth/2);

track.style.transform =
`translateX(${center - offset}px)`;

slides.forEach(s=>s.classList.remove("active"));
slides[current].classList.add("active");
}

/* smooth infinite motion */
function next(){
current++;
render();
if(current > loop.length - 40) current -= works.length;
}

function prev(){
current--;
render();
if(current < 40) current += works.length;
}

/* =========================
   OVERLAY LOGIC
========================= */

let activeWork = null;
let dIndex = 0;

function openOverlay(i){

activeWork = works[i];

/* ensure correct order already built */
dIndex = 0;

document.getElementById("overlay").classList.add("active");

showDetail();
}

function showDetail(){

document.getElementById("overlayImg").src =
activeWork.images[dIndex];

document.getElementById("caption").innerHTML =
`<div><i>${activeWork.title}</i></div>`;
}

function nextDetail(e){
e.stopPropagation();
dIndex = (dIndex + 1) % activeWork.images.length;
showDetail();
}

function prevDetail(e){
e.stopPropagation();
dIndex = (dIndex - 1 + activeWork.images.length) % activeWork.images.length;
showDetail();
}

function closeOverlay(){
document.getElementById("overlay").classList.remove("active");
}

/* =========================
   INIT
========================= */

window.addEventListener("load", render);
window.addEventListener("resize", render);

</script>

</body>
</html>
