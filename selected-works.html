<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>

body{
margin:0;
background:#f8f8f4;
overflow:hidden;
font-family:Arial,sans-serif;
color:#111;
text-transform:uppercase;
}

/* NAME */
.name{
position:fixed;
top:16px;
left:24px;
font-size:18px;
font-weight:bold;
z-index:40;
}

/* LINKS */
.links{
position:fixed;
top:24px;
right:24px;
display:flex;
gap:22px;
z-index:40;
}

.links a{
text-decoration:none;
color:#111;
font-size:11px;
transition:.2s ease;
}

.links a:hover{
font-weight:bold;
font-size:12px;
}

.links a.active{
font-style:italic;
}

/* VIEWER */
.viewer{
position:relative;
width:100vw;
height:100vh;
display:flex;
align-items:center;
overflow:hidden;
}

/* TRACK */
.track{
display:flex;
gap:30px;
will-change:transform;
transition:transform .35s cubic-bezier(.22,.61,.36,1);
}

/* SLIDE */
.slide{
flex:none;
display:flex;
flex-direction:column;
}

/* IMAGE */
.imageWrap{
height:70vh;
display:flex;
align-items:center;
justify-content:center;
}

.imageWrap img{
max-height:70vh;
max-width:80vw;
object-fit:contain;
display:block;
cursor:zoom-in;
user-select:none;
-webkit-user-drag:none;
filter:grayscale(100%);
transition:filter .3s ease;
}

.slide.active img{
filter:grayscale(0%);
}

/* NAV */
.nav{
position:fixed;
top:0;
width:12vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
z-index:50;
}

.nav.left{left:0;}
.nav.right{right:0;}

.arrow{
font-size:34px;
opacity:.15;
transition:.2s ease;
}

.nav:hover .arrow{
opacity:1;
transform:scale(1.1);
}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
}

.overlay.active{
display:flex;
}

.overlayNav{
position:fixed;
top:0;
width:12vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
z-index:1010;
}

.overlayNav.left{left:0;}
.overlayNav.right{right:0;}

.overlayArrow{
color:#fff;
font-size:40px;
opacity:.2;
transition:.2s ease;
}

.overlayNav:hover .overlayArrow{
opacity:1;
transform:scale(1.1);
}

.close{
position:absolute;
top:20px;
right:28px;
font-size:32px;
color:#fff;
z-index:1020;
cursor:pointer;
}

.overlayCaption{
margin-top:14px;
color:#fff;
font-size:11px;
text-align:center;
}

</style>
</head>

<body>

<div class="name">SOLOMON ROUSSEAU</div>

<div class="links">
<a href="selected-works.html" class="active">SELECTED WORKS</a>
<a href="exhibitions.html">SELECTED EXHIBITIONS + RESIDENCIES</a>
<a href="acquisitions.html">ACQUISITIONS</a>
<a href="artist.html">ARTIST</a>
</div>

<div class="viewer">
<div class="nav left" onclick="prev()"><div class="arrow">◀</div></div>
<div class="nav right" onclick="next()"><div class="arrow">▶</div></div>
<div class="track" id="track"></div>
</div>

<div class="overlay" id="overlay">
<div class="overlayNav left" onclick="prevDetail(event)"><div class="overlayArrow">◀</div></div>
<div class="overlayNav right" onclick="nextDetail(event)"><div class="overlayArrow">▶</div></div>
<div class="close" onclick="closeOverlay()">×</div>
<div class="overlayCaption" id="caption"></div>
<img id="overlayImg">
</div>

<script>

/* WORKS */
const works = [
{
title:"UNTITLED (ROWS)",
images:["SR-rows.JPG","SR-rows-D1.JPG","SR-rows-D2.JPG","SR-rows-D3.JPG"]
},
{
title:"UNTITLED (COIL I)",
images:["SR-coil(I).webp"]
},
{
title:"UNTITLED (COIL IX)",
images:["SR-coil(IX).JPG","SR-coil(IX)-D1.JPG","SR-coil(IX)-D2.JPG"]
},
{
title:"UNTITLED (SCATTER)",
images:["SR-scatter.JPG","SR-scatter-D1.JPG"]
},
{
title:"UNTITLED (TUBES)",
images:["SR-tubes.JPG","SR-tubes-D1.JPG"]
}
];

/* build infinite loop */
const track=document.getElementById("track");
const loop=[...works,...works,...works];

loop.forEach((w,i)=>{
const d=document.createElement("div");
d.className="slide";
d.innerHTML=`
<div class="imageWrap">
<img src="${w.images[0]}">
</div>
`;
d.querySelector("img").onclick=()=>open(i%works.length);
track.appendChild(d);
});

const slides=document.querySelectorAll(".slide");

/* START ON COIL IX (index 2) */
let current = works.length + 2;

/* smooth update */
function render(){
let offset=0;

for(let i=0;i<current;i++){
offset+=slides[i].offsetWidth+30;
}

const center=(window.innerWidth/2)-(slides[current].offsetWidth/2);

track.style.transform=`translateX(${center-offset}px)`;

slides.forEach(s=>s.classList.remove("active"));
slides[current].classList.add("active");
}

/* infinite without snapping */
function fixLoop(){
if(current>=works.length*2){
current-=works.length;
render();
}
if(current<works.length){
current+=works.length;
render();
}
}

/* nav */
function next(){
current++;
render();
setTimeout(fixLoop,350);
}

function prev(){
current--;
render();
setTimeout(fixLoop,350);
}

/* overlay */
let active=null;
let dIndex=0;

function open(i){
active=works[i];
dIndex=0;
show();
document.getElementById("overlay").classList.add("active");
}

function show(){
document.getElementById("overlayImg").src=active.images[dIndex];
document.getElementById("caption").innerHTML=active.title;
}

function nextDetail(e){
e.stopPropagation();
dIndex=(dIndex+1)%active.images.length;
show();
}

function prevDetail(e){
e.stopPropagation();
dIndex=(dIndex-1+active.images.length)%active.images.length;
show();
}

function closeOverlay(){
document.getElementById("overlay").classList.remove("active");
}

/* init */
window.addEventListener("load",render);
window.addEventListener("resize",render);

</script>

</body>
</html>
