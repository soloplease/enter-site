<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Selected Works</title>

<style>
body{
  margin:0;
  background:#f2f2ee;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:#111;
}

/* TITLE */

.title{
  position:fixed;
  top:18px;
  width:100%;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  letter-spacing:.5px;
  z-index:20;
}

/* LINKS */

.links{
  position:fixed;
  top:20px;
  left:24px;
  display:flex;
  gap:24px;
  z-index:20;
}

.links a{
  text-decoration:none;
  color:#111;
  font-size:13px;
  font-style:italic;
}

.links a:hover{
  opacity:.5;
}

/* SLIDESHOW */

.viewer{
  position:relative;
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.track{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding-left:24vw;
  transition:transform .45s ease;
  will-change:transform;
}

.slide{
  flex:none;
  width:42vw;
  position:relative;
}

.slide img{
  width:100%;
  height:72vh;
  object-fit:cover;
  display:block;
  cursor:zoom-in;
}

/* TEXT */

.caption{
  margin-top:8px;
  font-size:12px;
  line-height:1.35;
}

.caption i{
  font-style:italic;
}

/* NAVIGATION */

.nav{
  position:fixed;
  top:0;
  width:15vw;
  height:100vh;
  z-index:15;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav.left{
  left:0;
}

.nav.right{
  right:0;
}

.arrow{
  font-size:24px;
  opacity:0;
  transition:.2s;
  user-select:none;
}

.nav:hover .arrow{
  opacity:.25;
}

/* ZOOM */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.overlay.active{
  display:flex;
}

.overlay img{
  max-width:92vw;
  max-height:84vh;
  object-fit:contain;
}

.close{
  position:absolute;
  top:20px;
  right:24px;
  color:white;
  font-size:28px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="title">SELECTED WORKS</div>

<div class="links">
  <a href="artist.html">Artist</a>
  <a href="exhibitions.html">Selected Exhibitions + Residencies</a>
</div>

<div class="viewer">

  <div class="nav left" onclick="prevSlide()">
    <div class="arrow">◀</div>
  </div>

  <div class="nav right" onclick="nextSlide()">
    <div class="arrow">▶</div>
  </div>

  <div class="track" id="track">

    <!-- IMAGE 1 -->

    <div class="slide">
      <img src="SR-rows.JPG" onclick="openZoom(this.src)">

      <div class="caption">
        <i>Untitled (scatter)</i><br>
        Steel<br>
        375 sq. ft<br>
        2026
      </div>
    </div>

    <!-- IMAGE 2 -->

    <div class="slide">
      <img src="./SR-rows-D1.JPG?v=2" onclick="openZoom(this.src)">

      <div class="caption">
        <i>Detail — Untitled (scatter)</i><br>
        Steel<br>
        375 sq. ft<br>
        2026
      </div>
    </div>

    <!-- IMAGE 3 -->

    <div class="slide">
      <img src="SR-rows-D2.JPG" onclick="openZoom(this.src)">

      <div class="caption">
        <i>Untitled (coil I)</i><br>
        Steel<br>
        12 in. D x 3.5 in. W<br>
        2024
      </div>
    </div>

    <!-- IMAGE 4 -->

    <div class="slide">
      <img src="SR-rows-D3.JPG" onclick="openZoom(this.src)">

      <div class="caption">
        <i>Untitled (coil IX)</i><br>
        Steel<br>
        23ft D x 1.6ft W<br>
        2026
      </div>
    </div>

  </div>

</div>

<!-- ZOOM -->

<div class="overlay" id="overlay" onclick="closeZoom()">
  <div class="close">×</div>
  <img id="zoomed">
</div>

<script>

const track = document.getElementById("track");

const slides = document.querySelectorAll(".slide");

let index = 0;

function updateSlide(){

  const slideWidth =
    slides[0].offsetWidth + 14;

  track.style.transform =
    `translateX(calc(24vw - ${index * slideWidth}px))`;
}

/* infinite carousel */

function nextSlide(){

  index++;

  if(index >= slides.length){

    track.appendChild(slides[0]);

    index--;

  }

  updateSlide();
}

function prevSlide(){

  if(index <= 0){

    track.prepend(track.lastElementChild);

  } else {

    index--;

  }

  updateSlide();
}

/* trackpad swipe */

let startX = 0;

window.addEventListener("wheel",(e)=>{

  if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){

    if(e.deltaX > 0){

      nextSlide();

    } else {

      prevSlide();

    }
  }
});

/* touch */

window.addEventListener("touchstart",(e)=>{

  startX = e.touches[0].clientX;

});

window.addEventListener("touchend",(e)=>{

  let endX = e.changedTouches[0].clientX;

  if(startX - endX > 40){

    nextSlide();

  }

  if(endX - startX > 40){

    prevSlide();

  }
});

/* zoom */

function openZoom(src){

  document.getElementById("overlay").classList.add("active");

  document.getElementById("zoomed").src = src;
}

function closeZoom(){

  document.getElementById("overlay").classList.remove("active");
}

updateSlide();

</script>

</body>
</html>
