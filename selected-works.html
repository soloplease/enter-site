<script>
const track = document.getElementById("track");

const works = [
{
img:"SR-rows.JPG",
title:"Untitled (scatter)",
material:"Steel",
size:"375 sq. ft",
year:"2026"
},
{
img:"SR-rows-D1.JPG",
title:"Untitled (coil I)",
material:"Steel",
size:"12 in. D x 3.5 in. W",
year:"2024"
},
{
img:"SR-rows-D2.JPG",
title:"Untitled (coil IX)",
material:"Steel",
size:"23ft D x 1.6ft W",
year:"2026"
},
{
img:"SR-rows-D3.JPG",
title:"Detail — Untitled (coil IX)",
material:"Steel",
size:"23ft D x 1.6ft W",
year:"2026"
}
];

let current = 0;

function buildSlides(){

track.innerHTML = "";

works.forEach(work=>{

const slide = document.createElement("div");
slide.className = "slide";

slide.innerHTML = `
<div class="imageWrap">
<img src="${work.img}">
</div>

<div class="caption">
<div>${work.title}</div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
</div>
`;

track.appendChild(slide);

const img = slide.querySelector("img");

img.addEventListener("click", ()=>{

document.getElementById("overlay").style.display = "flex";
document.getElementById("overlayImg").src = work.img;

document.getElementById("overlayCaption").innerHTML = `
<div>${work.title}</div>
<div>${work.material}</div>
<div>${work.size}</div>
<div>${work.year}</div>
`;

});

});

update();
}

function update(){
track.style.transform = `translateX(calc(-${current * 100}vw + 240px))`;
}

function next(){
current = (current + 1) % works.length;
update();
}

function prev(){
current = (current - 1 + works.length) % works.length;
update();
}

document.getElementById("rightZone").onclick = next;
document.getElementById("leftZone").onclick = prev;

document.addEventListener("keydown",(e)=>{
if(e.key==="ArrowRight") next();
if(e.key==="ArrowLeft") prev();
});

document.getElementById("overlay").onclick = ()=>{
document.getElementById("overlay").style.display = "none";
};

buildSlides();
</script>
