<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enter</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:#f2f2ee; /* soft off-white */
  font-family:Arial, sans-serif;
}

/* wrapper for brackets + input */
.wrapper{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
/* brackets */
.bracket{
  font-size:28px;
  color:#111;
  line-height:1;
}

/* input */
input{
  border:none;
  outline:none;
  background:transparent;
  font-size:28px;
  height:28px;
  line-height:28px;
  text-align:center;
  letter-spacing:4px;

  width:60px;
  min-width:60px;

  color:#111;

  transition:width 0.15s ease;
}

/* success / fail states */
.valid{
  color:#111;
}

.invalid{
  color:#111;
}

/* name */
.name{
  margin-top:40px;
  font-weight:bold;
  letter-spacing:8px;
  font-size:14px;
  color:#111;
}
  
  #statusBox{
  width:14px;
  height:14px;
  border:1px solid #111;
  margin-left:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:#111;
}
</style>
</head>

<body>

<div class="wrapper">
  <span class="bracket">[</span>

  <input type="text" id="code" oninput="expand()" onkeydown="handle(event)" autocomplete="off">

  <span class="bracket">]</span>

  <div id="statusBox"></div>
</div>
  
<div class="name">SOLOMON ROUSSEAU</div>

<script>
const codes = ["axis","strike","line"];

const input = document.getElementById("code");

/* expand from center */
function expand(){
  let len = input.value.length;
  input.style.width = (40 + len * 14) + "px";
}

/* handle enter */
function handle(e){
  if(e.key === "Enter"){
    const box = document.getElementById("statusBox");

    if(codes.includes(input.value)){
      box.innerHTML = "✓";

      setTimeout(()=>{
        window.location = "gallery.html";
      }, 700);

    } else {
      box.innerHTML = "✕";

      setTimeout(()=>{
        input.value = "";
        box.innerHTML = "";
        expand();
      }, 700);
    }
  }
}
</script>

</body>
</html>
