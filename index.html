<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Solomon Rousseau</title>

<meta name="description" content="Solomon Rousseau — artist working with systems, structure, and spatial interfaces.">
<meta name="robots" content="noindex, nofollow">

<style>

body{
margin:0;
height:100vh;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:#f2f2ee;

font-family:Arial,sans-serif;
}

/* WRAPPER */

.wrapper{
display:flex;
align-items:center;
justify-content:center;
gap:6px;
}

/* BRACKETS */

.bracket{
font-size:28px;
color:#111;
}

/* INPUT */

input{
border:none;
outline:none;
background:transparent;

font-size:28px;
text-align:center;
letter-spacing:4px;

width:80px;

color:#111;
}

/* STATUS */

#statusBox{
width:14px;
height:14px;

border:1px solid #111;

margin-left:12px;

display:flex;
align-items:center;
justify-content:center;

font-size:12px;
color:#111;
}

/* NAME */

.name{
margin-top:40px;
font-size:14px;
letter-spacing:8px;
color:#111;
}

</style>
</head>

<body>

<div class="wrapper">

<span class="bracket">[</span>

<input
type="text"
id="code"
onkeydown="handle(event)"
autocomplete="off"
spellcheck="false"
>

<span class="bracket">]</span>

<div id="statusBox"></div>

</div>

<h1 class="name">Solomon Rousseau</h1>

<script>

/* =========================
   PASSWORD LIST
========================= */

const passwords = [
"leeufan",
"rserra",
];

function handle(e){

if(e.key !== "Enter") return;

const input = document.getElementById("code");
const box = document.getElementById("statusBox");

const value = input.value.trim().toLowerCase();

/* SUCCESS */
if(passwords.includes(value)){

box.innerHTML = "✓";

/* allow access */
sessionStorage.setItem("site-auth","granted");

/* redirect */
setTimeout(()=>{
window.location.href = "selected-works.html";
},600);

return;
}

/* FAIL */

box.innerHTML = "✕";

setTimeout(()=>{
input.value = "";
box.innerHTML = "";
},600);

}

</script>

</body>
</html>
